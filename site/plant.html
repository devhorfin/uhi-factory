<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>THE PLANT · UHI Factory</title>
<meta name="description" content="Watch the robots work. 30 halls and the agency, every move a verb from the shift log.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=0.5.2"><link rel="stylesheet" href="css/factory.css?v=0.5.2">
<style>
  html, body { height: 100%; overflow: hidden; }
  .pp { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .pp .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: rgba(10,10,10,.85); backdrop-filter: blur(10px); }
  .pp .bar .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; } .pp .bar .brand img { width: 24px; height: 24px; }
  .pp .bar .r { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .pp .stage { flex: 1; height: auto; min-height: 0; border-radius: 0; border: 0; }
  .pp .foot { font-size: 11px; }
  .pp .hint { position: absolute; z-index: 3; left: 50%; top: 14px; transform: translateX(-50%); color: var(--mute); font: 400 12px/1.4 var(--mono); text-align: center; pointer-events: none; }
  @media (max-width: 760px) { .pp .bar { padding: 8px 10px; } .pp .bar .brand span { display: none; } .pp .bar .pill.sm { padding: 0 9px; } }
</style>
</head>
<body>
<div class="pp">
  <div class="bar">
    <a class="brand" href="index.html"><img src="assets/glyph.webp" alt=""><span class="chrome">THE PLANT</span></a>
    <span class="live" id="live" style="font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--ok)">CONNECTING</span>
    <div class="r">
      <button class="pill sm on" type="button" id="attract">Attract</button>
      <button class="pill sm" type="button" id="sound">Sound</button>
      <button class="pill sm" type="button" id="overview">All halls</button>
      <a class="pill sm ico" href="https://x.com/devHorfin" target="_blank" rel="noopener" aria-label="devHorfin on X"><img src="assets/x-logo.svg" alt="X"></a><a class="pill sm" href="https://github.com/devhorfin/uhi-factory" target="_blank" rel="noopener">GitHub</a>
      <a class="pill sm" href="index.html">Home</a>
    </div>
  </div>
  <div class="stage" id="stage"><canvas id="plant"></canvas><div class="hint" id="hint">tap a hall to enter · drag to pan · pinch or wheel to zoom · tap a robot for its work</div><div class="tip" id="tip" hidden></div><div class="caption" id="caption" hidden></div><div class="foot" id="stageFoot"></div></div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBody"></div></div>
<script type="module" src="js/plantpage.js?v=0.5.2"></script>
</body>
</html>
